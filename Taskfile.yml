# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  download-dataset:
    desc: Download MIT-BIH Arrhythmia Database using wget
    aliases: [download-dataset-wget]
    cmds:
      - wget -r -N -c -np -nd -P dataset/mit-bih-arrhythmia-database-1.0.0 -e robots=off https://physionet.org/files/mitdb/1.0.0/

  download-dataset-curl:
    desc: Download and extract MIT-BIH Arrhythmia Database using curl and tar
    cmds:
      - curl.exe -L -o dataset/mitdb.zip https://physionet.org/static/published-projects/mitdb/mit-bih-arrhythmia-database-1.0.0.zip
      - tar -xf dataset/mitdb.zip -C dataset

  install-packages:
    desc: Install project dependencies with uv
    cmds:
      - uv sync

  to-requirements-txt:
    desc: Compile locked requirements.txt
    cmds:
      - uv pip compile pyproject.toml -o requirements.txt

  prepare-data:
    desc: Run the complete data preparation pipeline (filtering, segmentation, normalization, export)
    cmds:
      - uv run python src/prepare_data.py

  run-notebook:
    desc: 'Execute a notebook in-place (usage: task run-notebook -- <file.ipynb>)'
    cmds:
      - uv run jupyter nbconvert --to notebook --execute --inplace "notebooks/{{.NOTEBOOK | default .CLI_ARGS}}"

  run-task1:
    desc: 'Execute CRISP-DM Stage 1: Business / Application Understanding notebook'
    cmds:
      - task: run-notebook
        vars: { NOTEBOOK: Task1_Business_Understanding.ipynb }

  run-task2:
    desc: 'Execute CRISP-DM Stage 2: Data Understanding (EDA) notebook'
    aliases: [run-eda]
    cmds:
      - task: run-notebook
        vars: { NOTEBOOK: EDA.ipynb }

  run-task3:
    desc: 'Execute CRISP-DM Stage 3: Data Preparation notebook'
    cmds:
      - task: run-notebook
        vars: { NOTEBOOK: Task3_Data_Preparation.ipynb }

  run-all-notebooks:
    desc: Execute all CRISP-DM Submission 1 notebooks in sequence
    cmds:
      - task: run-task1
      - task: run-task2
      - task: run-task3

  train:
    desc: 'Train CNN model in a new isolated run with evaluation (usage: task train -- [extra args])'
    cmds:
      - uv run python src/train.py --model CNN --epochs 20 --lr 0.001 --optimizer adam --run --eval {{.CLI_ARGS}}

  train-baseline:
    desc: 'Train LogisticRegression in a new isolated run with evaluation'
    cmds:
      - uv run python src/train.py --model LogisticRegression --epochs 15 --seed 42 --run --eval {{.CLI_ARGS}}

  evaluate-baseline:
    desc: 'Evaluate LogisticRegression (latest run by default, or specify --run runN)'
    cmds:
      - uv run python src/evaluate.py --model LogisticRegression --run latest {{.CLI_ARGS}}

  train-rf:
    desc: 'Train RandomForest in a new isolated run with evaluation'
    cmds:
      - uv run python src/train.py --model RandomForest --seed 42 --run --eval {{.CLI_ARGS}}

  evaluate-rf:
    desc: 'Evaluate RandomForest (latest run by default, or specify --run runN)'
    cmds:
      - uv run python src/evaluate.py --model RandomForest --run latest {{.CLI_ARGS}}

  train-cnn:
    desc: 'Train CNN model in a new isolated run with evaluation'
    cmds:
      - uv run python src/train.py --model CNN --epochs 20 --lr 0.001 --optimizer adam --seed 42 --run --eval {{.CLI_ARGS}}

  evaluate-cnn:
    desc: 'Evaluate CNN model (latest run by default, or specify --run runN)'
    cmds:
      - uv run python src/evaluate.py --model CNN --run latest {{.CLI_ARGS}}

  train-run:
    desc: 'Train and automatically evaluate model in isolated run folder (usage: task train-run -- --model RandomForest --resample hybrid)'
    cmds:
      - uv run python src/train.py --run --eval {{.CLI_ARGS}}

  evaluate:
    desc: 'Evaluate latest isolated run on held-out test split (DS2)'
    aliases: [evaluate-run]
    cmds:
      - uv run python src/evaluate.py --run latest {{.CLI_ARGS}}

  purge:
    desc: 'Purge model checkpoints (usage: task purge), or purge all runs and outputs (usage: task purge -- all)'
    cmds:
      - powershell -NoProfile -Command "if ('{{.CLI_ARGS}}' -match 'all') { Write-Host 'Purging all runs and result outputs (preserving .gitkeep)...'; if (Test-Path results/runs) { Get-ChildItem results/runs -Recurse -File -Exclude .gitkeep | Remove-Item -Force -ErrorAction SilentlyContinue; Get-ChildItem results/runs -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue; if (-not (Test-Path results/runs/.gitkeep)) { New-Item -ItemType File -Force -Path results/runs/.gitkeep | Out-Null } }; Get-ChildItem results -File -Include *.pt,*.joblib,confusion_matrix.png,confusion_matrix.csv,metrics.csv,per_class_metrics.csv,*_training_history.csv -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue; Write-Host 'All runs and result outputs purged successfully.' } else { Write-Host 'Purging model checkpoint files (*.pt, *.joblib)...'; Get-ChildItem results -Recurse -Include *.pt,*.joblib -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue; Write-Host 'Model checkpoints purged successfully.' }"

  purge-all:
    desc: 'Purge all runs and result outputs (alias for: task purge -- all)'
    cmds:
      - task: purge
        vars: { CLI_ARGS: 'all' }

  lint:
    desc: Lint code with ruff
    cmds:
      - uv run ruff check --fix

  format:
    desc: Format code with ruff
    cmds:
      - uv run ruff format
